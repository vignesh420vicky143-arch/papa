<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Animation</title>

<style>
body {
  margin: 0;
  background-color: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* HEART */
.heart {
  position: relative;
  width: 120px;
  height: 120px;
  background: rgb(252, 2, 139);
  transform: rotate(-45deg);
  animation: beat 1s infinite;
  box-shadow: 0 0 20px rgb(241, 5, 182), 0 0 40px crimson;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 120px;
  height: 120px;
  background: rgb(255, 0, 140);
  border-radius: 50%;
}

.heart::before {
  top: -60px;
  left: 0;
}

.heart::after {
  left: 60px;
  top: 0;
}

/* HEART BEAT */
@keyframes beat {
  0% { transform: rotate(-45deg) scale(1); }
  25% { transform: rotate(-45deg) scale(1.2); }
  50% { transform: rotate(-45deg) scale(1); }
  75% { transform: rotate(-45deg) scale(1.2); }
  100% { transform: rotate(-45deg) scale(1); }
}

/* TEXT */
.text {
  margin-top: 40px;
  font-size: 45px;
  font-weight: bold;
  color: pink;
  text-shadow:
    0 0 10px red,
    0 0 20px hotpink,
    0 0 40px crimson;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { opacity: 0.7; }
  to { opacity: 1; }
}

/* FLOATING HEARTS */
.small-heart {
  position: absolute;
  color: pink;
  font-size: 20px;
  animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}
</style>

</head>
<body>

<div class="heart"></div>

<div class="text"> I LOVE 🫂 YOU PAPA ❤️</div>

<script>
// Floating hearts effect
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("small-heart");
  heart.innerHTML = "❤️";

  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
